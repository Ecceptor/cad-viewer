server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP Basic Authentication (Gatekeeping for Confidential CAD Review)
    auth_basic "Confidential CAD VR Review - Authorization Required";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;

    # MIME types
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary               glb;
        model/gltf+json                 gltf;
        application/javascript          js mjs;
        application/json                json;
    }

    # Static Assets & Fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Health check endpoint (for Cloud Run load balancer / container health checks)
    location /healthz {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
